name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST" || { echo "Missing secret EC2_HOST"; exit 1; }
          test -n "$EC2_USER" || { echo "Missing secret EC2_USER"; exit 1; }
          test -n "$EC2_SSH_KEY" || { echo "Missing secret EC2_SSH_KEY — paste the PRIVATE .pem key, not .pub"; exit 1; }
          echo "$EC2_SSH_KEY" | head -n 1 | grep -q "BEGIN" || { echo "EC2_SSH_KEY must start with -----BEGIN"; exit 1; }

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build Node server
        run: |
          npm ci
          npm run build:ec2
          test -f .output/server/index.mjs
          grep -q '"preset": "node-server"' .output/nitro.json

      - name: Pack release
        run: tar -czf calldiesel-release.tar.gz .output deploy/ecosystem.config.cjs

      - name: Copy release and reload PM2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            calldiesel-release.tar.gz \
            "$EC2_USER@$EC2_HOST:/tmp/calldiesel-release.tar.gz"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_DIR="$HOME/calldiesel"
          mkdir -p "$APP_DIR"
          tar -xzf /tmp/calldiesel-release.tar.gz -C "$APP_DIR"
          rm -f /tmp/calldiesel-release.tar.gz
          cd "$APP_DIR"
          pm2 startOrReload deploy/ecosystem.config.cjs --update-env
          pm2 save
          curl -fsS --retry 5 --retry-delay 2 http://127.0.0.1:3011/ >/dev/null
          echo "Call Diesel is up on port 3011"
          REMOTE
