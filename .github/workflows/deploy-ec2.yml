name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build Node server
        run: |
          npm ci
          npm run build:ec2
          test -f .output/server/index.mjs
          grep -q '"preset": "node-server"' .output/nitro.json

      - name: Pack release
        run: tar -czf calldiesel-release.tar.gz .output deploy/ecosystem.config.cjs

      - name: Copy release to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: calldiesel-release.tar.gz
          target: /tmp
          timeout: 120s

      - name: Unpack and reload PM2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="$HOME/calldiesel"
            mkdir -p "$APP_DIR"
            tar -xzf /tmp/calldiesel-release.tar.gz -C "$APP_DIR"
            rm -f /tmp/calldiesel-release.tar.gz
            cd "$APP_DIR"
            pm2 startOrReload deploy/ecosystem.config.cjs --update-env
            pm2 save
            curl -fsS --retry 5 --retry-delay 2 http://127.0.0.1:3011/ >/dev/null
            echo "Call Diesel is up on port 3011"
