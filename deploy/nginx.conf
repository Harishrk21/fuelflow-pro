# Extra Nginx site for Call Diesel. Does not replace your other projects.
# After DNS points here:
#   sudo certbot --nginx -d www.calldiesel.in -d calldiesel.in

server {
    listen 80;
    listen [::]:80;
    server_name calldiesel.in;

    return 301 http://www.calldiesel.in$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.calldiesel.in;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
